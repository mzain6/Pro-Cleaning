    <!-- First visit this session? Paint plum straight away so there's no cream flash
         before the loading scene mounts. Keep in sync with src/utils/boot.js -->
    <style>
      html.splash-pending,
      html.splash-pending body {
        background: #2a1232;
      }
    </style>
    <script>
      try {
        if (/[?&]splash\b/.test(location.search) || !sessionStorage.getItem("whoa-splash-seen")) {
          document.documentElement.classList.add("splash-pending");
        }
      } catch (e) {
        document.documentElement.classList.add("splash-pending");
      }
    </script>
